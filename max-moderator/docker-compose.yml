services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: max
      POSTGRES_PASSWORD: max
      POSTGRES_DB: max_moderator
    ports:
      - "5433:5432"
    volumes:
      - max_moderator_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U max -d max_moderator"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    image: max-moderator-bot
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NODE_EXTRA_CA_CERTS: /certs/russian-trusted-ca.pem
      CHECKPOINT_DISABLE: "1"
      DATABASE_URL: postgresql://max:max@postgres:5432/max_moderator?schema=public
      REDIS_URL: redis://redis:6379
    volumes:
      - ./certs/russian-trusted-ca.pem:/certs/russian-trusted-ca.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  max_moderator_pg:
