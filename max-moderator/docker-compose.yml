services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxmod
      POSTGRES_PASSWORD: maxmod
      POSTGRES_DB: maxmod
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - maxmod-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U maxmod -d maxmod']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  bot:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  maxmod-pg:
