services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maxmod
      POSTGRES_PASSWORD: maxmod
      POSTGRES_DB: max_moderator
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxmod -d max_moderator"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://maxmod:maxmod@postgres:5432/max_moderator?schema=public
      REDIS_URL: redis://redis:6379
      MAX_API_BASE_URL: https://platform-api2.max.ru
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
